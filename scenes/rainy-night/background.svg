<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dusk" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#2a3050"/>
      <stop offset="50%" stop-color="#4a4868"/>
      <stop offset="100%" stop-color="#6a6478"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#a89678"/>
      <stop offset="100%" stop-color="#7a6440"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6b513a"/>
      <stop offset="100%" stop-color="#3a2718"/>
    </linearGradient>
    <radialGradient id="lampGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#ffd28c" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#ffb068" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd28c" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="windowClip">
      <rect x="426" y="132" width="356" height="296"/>
    </clipPath>
  </defs>

  <style><![CDATA[
    @keyframes lamp-pulse { 0%, 100% { opacity: 0.78; } 50% { opacity: 1; } }
    @keyframes cat-breathe {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-2px) scale(1.02); }
    }
    @keyframes steamA {
      0%   { transform: translate(0, 0) scaleX(1); opacity: 0; }
      25%  { opacity: 0.7; }
      100% { transform: translate(-10px, -70px) scaleX(1.4); opacity: 0; }
    }
    @keyframes steamB {
      0%   { transform: translate(0, 0) scaleX(1); opacity: 0; }
      25%  { opacity: 0.6; }
      100% { transform: translate(8px, -75px) scaleX(1.4); opacity: 0; }
    }
    @keyframes drop {
      0%   { transform: translateY(-50px); opacity: 0; }
      10%  { opacity: 0.7; }
      90%  { opacity: 0.7; }
      100% { transform: translateY(140px); opacity: 0; }
    }
    .lamp-halo { animation: lamp-pulse 4.5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .cat-body  { animation: cat-breathe 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .steam-1   { animation: steamA 3.0s ease-out infinite;       transform-origin: center; transform-box: fill-box; }
    .steam-2   { animation: steamB 3.4s ease-out infinite 1.0s;  transform-origin: center; transform-box: fill-box; }
    .steam-3   { animation: steamA 3.2s ease-out infinite 2.0s;  transform-origin: center; transform-box: fill-box; }
    .rain-1 { animation: drop 1.10s linear infinite;        transform-origin: center; transform-box: fill-box; }
    .rain-2 { animation: drop 0.95s linear infinite 0.15s;  transform-origin: center; transform-box: fill-box; }
    .rain-3 { animation: drop 1.05s linear infinite 0.30s;  transform-origin: center; transform-box: fill-box; }
    .rain-4 { animation: drop 1.00s linear infinite 0.45s;  transform-origin: center; transform-box: fill-box; }
    .rain-5 { animation: drop 0.90s linear infinite 0.10s;  transform-origin: center; transform-box: fill-box; }
    .rain-6 { animation: drop 1.08s linear infinite 0.25s;  transform-origin: center; transform-box: fill-box; }
    .rain-7 { animation: drop 0.92s linear infinite 0.40s;  transform-origin: center; transform-box: fill-box; }
    .rain-8 { animation: drop 1.04s linear infinite 0.55s;  transform-origin: center; transform-box: fill-box; }
    .rain-9 { animation: drop 0.98s linear infinite 0.20s;  transform-origin: center; transform-box: fill-box; }
    .rain-10 { animation: drop 1.02s linear infinite 0.35s; transform-origin: center; transform-box: fill-box; }
  ]]></style>

  <!-- back wall + floor -->
  <rect x="0" y="0" width="1600" height="710" fill="url(#wall)"/>
  <rect x="0" y="710" width="1600" height="290" fill="url(#floor)"/>

  <!-- wood plank lines on wall -->
  <g stroke="rgba(0,0,0,0.06)" stroke-width="1.5">
    <line x1="0" y1="120" x2="1600" y2="120"/>
    <line x1="0" y1="260" x2="1600" y2="260"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="540" x2="1600" y2="540"/>
    <line x1="0" y1="680" x2="1600" y2="680"/>
  </g>

  <!-- floor plank lines -->
  <g stroke="rgba(0,0,0,0.22)" stroke-width="2">
    <line x1="0" y1="790" x2="1600" y2="790"/>
    <line x1="0" y1="880" x2="1600" y2="880"/>
    <line x1="0" y1="970" x2="1600" y2="970"/>
  </g>

  <!-- ============ WINDOW (center, with breathing room from the wall-clock zone) ============ -->
  <!-- sky/pane -->
  <rect x="420" y="126" width="368" height="308" fill="url(#dusk)" stroke="#3a2f24" stroke-width="14"/>
  <!-- mullions -->
  <line x1="604" y1="126" x2="604" y2="434" stroke="#3a2f24" stroke-width="6"/>
  <line x1="420" y1="280" x2="788" y2="280" stroke="#3a2f24" stroke-width="6"/>
  <!-- distant houses lit windows -->
  <g fill="#ffe8b8" opacity="0.85">
    <rect x="494" y="350" width="3" height="4"/>
    <rect x="504" y="354" width="3" height="3"/>
    <rect x="529" y="348" width="3" height="4"/>
    <rect x="634" y="356" width="3" height="3"/>
    <rect x="654" y="352" width="3" height="4"/>
    <rect x="672" y="358" width="3" height="3"/>
  </g>
  <!-- distant building silhouettes -->
  <g fill="#1a1f30" opacity="0.55">
    <rect x="434" y="340" width="80" height="60"/>
    <rect x="520" y="320" width="60" height="80"/>
    <rect x="614" y="335" width="90" height="65"/>
    <rect x="714" y="355" width="60" height="45"/>
  </g>
  <!-- pine silhouettes overlapping buildings -->
  <g fill="#1a2530" opacity="0.85">
    <polygon points="434,380 464,260 499,380"/>
    <polygon points="489,390 529,210 569,390"/>
    <polygon points="614,380 654,265 694,380"/>
    <polygon points="674,395 714,275 754,395"/>
  </g>
  <!-- rain in window -->
  <g clip-path="url(#windowClip)" stroke-linecap="round">
    <line class="rain-1"  x1="454" y1="135" x2="450" y2="155" stroke="rgba(220,230,250,0.7)" stroke-width="2"/>
    <line class="rain-2"  x1="494" y1="148" x2="490" y2="168" stroke="rgba(220,230,250,0.6)" stroke-width="2"/>
    <line class="rain-3"  x1="529" y1="160" x2="525" y2="180" stroke="rgba(220,230,250,0.65)" stroke-width="2"/>
    <line class="rain-4"  x1="559" y1="140" x2="555" y2="160" stroke="rgba(220,230,250,0.55)" stroke-width="2"/>
    <line class="rain-5"  x1="594" y1="170" x2="590" y2="190" stroke="rgba(220,230,250,0.7)" stroke-width="2"/>
    <line class="rain-6"  x1="629" y1="135" x2="625" y2="155" stroke="rgba(220,230,250,0.6)" stroke-width="2"/>
    <line class="rain-7"  x1="664" y1="145" x2="660" y2="165" stroke="rgba(220,230,250,0.6)" stroke-width="2"/>
    <line class="rain-8"  x1="699" y1="160" x2="695" y2="180" stroke="rgba(220,230,250,0.65)" stroke-width="2"/>
    <line class="rain-9"  x1="729" y1="138" x2="725" y2="158" stroke="rgba(220,230,250,0.55)" stroke-width="2"/>
    <line class="rain-10" x1="759" y1="155" x2="755" y2="175" stroke="rgba(220,230,250,0.6)" stroke-width="2"/>
  </g>

  <!-- window sill / inner ledge -->
  <rect x="412" y="430" width="384" height="14" fill="#5a4838"/>
  <rect x="408" y="444" width="392" height="6" fill="#3a2f24"/>

  <!-- ============ DESK ============ -->
  <rect x="180" y="700" width="900" height="38" fill="#5a4838"/>
  <rect x="180" y="738" width="900" height="14" fill="#3a2f24"/>
  <!-- legs -->
  <rect x="210" y="752" width="22" height="200" fill="#3a2f24"/>
  <rect x="1030" y="752" width="22" height="200" fill="#3a2f24"/>

  <!-- ============ LAMP (left of desk) ============ -->
  <ellipse class="lamp-halo" cx="320" cy="690" rx="200" ry="80" fill="url(#lampGlow)"/>
  <g transform="translate(280,540)">
    <!-- base -->
    <ellipse cx="40" cy="160" rx="26" ry="6" fill="#3a2f24"/>
    <!-- post -->
    <line x1="40" y1="160" x2="40" y2="60" stroke="#3a2f24" stroke-width="6" stroke-linecap="round"/>
    <!-- joint -->
    <circle cx="40" cy="60" r="6" fill="#3a2f24"/>
    <!-- arm -->
    <line x1="40" y1="60" x2="80" y2="32" stroke="#3a2f24" stroke-width="6" stroke-linecap="round"/>
    <!-- shade -->
    <polygon points="58,32 110,32 96,-4 76,-4" fill="#3a2f24"/>
    <!-- bulb glow -->
    <ellipse cx="84" cy="32" rx="22" ry="5" fill="#ffd28c"/>
  </g>

  <!-- ============ BOOK STACK on desk ============ -->
  <g transform="translate(520,664)">
    <rect x="0" y="0"  width="90" height="14" fill="#7d5d4a"/>
    <rect x="3" y="14" width="87" height="14" fill="#9c6b48"/>
    <rect x="0" y="28" width="90" height="14" fill="#5a4838"/>
  </g>

  <!-- ============ OPEN NOTEBOOK ============ -->
  <g transform="translate(650,690)">
    <rect x="0" y="0" width="190" height="16" fill="#f4ecdc" stroke="#3a2f24" stroke-width="2"/>
    <line x1="95" y1="0" x2="95" y2="16" stroke="#3a2f24" stroke-width="1"/>
    <line x1="14" y1="6"  x2="84" y2="6"  stroke="#8a8578" stroke-width="0.8"/>
    <line x1="14" y1="10" x2="74" y2="10" stroke="#8a8578" stroke-width="0.8"/>
    <line x1="106" y1="6"  x2="176" y2="6"  stroke="#8a8578" stroke-width="0.8"/>
    <line x1="106" y1="10" x2="166" y2="10" stroke="#8a8578" stroke-width="0.8"/>
  </g>

  <!-- ============ COFFEE MUG + STEAM ============ -->
  <g transform="translate(860,640)">
    <!-- handle -->
    <path d="M 42 30 q 22 0 22 18 q 0 18 -22 18" fill="none" stroke="#d8c3a3" stroke-width="6" stroke-linecap="round"/>
    <!-- body -->
    <rect x="0" y="20" width="44" height="50" rx="4" fill="#d8c3a3"/>
    <!-- coffee surface -->
    <ellipse cx="22" cy="22" rx="20" ry="5" fill="#3a1f10"/>
    <!-- steam (animated) -->
    <g transform="translate(10,18)">
      <path class="steam-1" d="M 0 0 q 5 -10 0 -22 q -5 -10 0 -22" fill="none" stroke="rgba(245,235,220,0.8)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(22,18)">
      <path class="steam-2" d="M 0 0 q 6 -10 0 -22 q -6 -10 0 -22" fill="none" stroke="rgba(245,235,220,0.75)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(34,18)">
      <path class="steam-3" d="M 0 0 q 5 -10 0 -22 q -5 -10 0 -22" fill="none" stroke="rgba(245,235,220,0.7)" stroke-width="2.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- ============ CAT (right side of desk, sleeping) ============ -->
  <g transform="translate(930,650)">
    <g class="cat-body">
      <!-- body -->
      <ellipse cx="60" cy="40" rx="70" ry="22" fill="#3a3328"/>
      <!-- head -->
      <ellipse cx="8" cy="32" rx="24" ry="20" fill="#3a3328"/>
      <!-- ears -->
      <polygon points="-10,16 -6,0 8,18" fill="#3a3328"/>
      <polygon points="6,14 12,-2 24,18" fill="#3a3328"/>
      <!-- inner ear -->
      <polygon points="-6,14 -3,4 4,14" fill="#5a3838" opacity="0.7"/>
      <polygon points="11,12 14,2 20,14" fill="#5a3838" opacity="0.7"/>
      <!-- closed eyes -->
      <path d="M 0 30 q 4 -2 8 0" fill="none" stroke="#241e16" stroke-width="2" stroke-linecap="round"/>
      <path d="M 14 30 q 4 -2 8 0" fill="none" stroke="#241e16" stroke-width="2" stroke-linecap="round"/>
      <!-- nose -->
      <polygon points="9,36 13,36 11,40" fill="#5a3030"/>
      <!-- mouth -->
      <path d="M 11 40 q -2 3 -4 2" fill="none" stroke="#241e16" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M 11 40 q 2 3 4 2" fill="none" stroke="#241e16" stroke-width="1.5" stroke-linecap="round"/>
      <!-- whiskers -->
      <line x1="-2" y1="38" x2="-20" y2="36" stroke="#241e16" stroke-width="1" opacity="0.6"/>
      <line x1="-2" y1="40" x2="-20" y2="42" stroke="#241e16" stroke-width="1" opacity="0.6"/>
      <line x1="22" y1="38" x2="40" y2="36" stroke="#241e16" stroke-width="1" opacity="0.6"/>
      <line x1="22" y1="40" x2="40" y2="42" stroke="#241e16" stroke-width="1" opacity="0.6"/>
      <!-- tail curled around -->
      <path d="M 128 42 q 38 -4 32 -28 q -4 -14 -14 -10" fill="none" stroke="#3a3328" stroke-width="22" stroke-linecap="round"/>
      <!-- tail tip lighter -->
      <circle cx="148" cy="14" r="9" fill="#3a3328"/>
      <!-- paw outlines -->
      <line x1="40" y1="58" x2="42" y2="62" stroke="#241e16" stroke-width="2.5"/>
      <line x1="78" y1="58" x2="80" y2="62" stroke="#241e16" stroke-width="2.5"/>
    </g>
  </g>

  <!-- ============ RADIO on right shelf ============ -->
  <rect x="1180" y="500" width="200" height="10" fill="#5a4838"/>
  <g transform="translate(1200,438)">
    <rect x="0" y="0" width="150" height="62" rx="4" fill="#7a5e44"/>
    <rect x="10" y="14" width="86" height="36" fill="#d8c3a3"/>
    <!-- speaker dots -->
    <g fill="#3a2f24">
      <circle cx="18" cy="22" r="1.5"/>
      <circle cx="28" cy="22" r="1.5"/>
      <circle cx="38" cy="22" r="1.5"/>
      <circle cx="48" cy="22" r="1.5"/>
      <circle cx="18" cy="32" r="1.5"/>
      <circle cx="28" cy="32" r="1.5"/>
      <circle cx="38" cy="32" r="1.5"/>
      <circle cx="48" cy="32" r="1.5"/>
      <circle cx="18" cy="42" r="1.5"/>
      <circle cx="28" cy="42" r="1.5"/>
      <circle cx="38" cy="42" r="1.5"/>
      <circle cx="48" cy="42" r="1.5"/>
    </g>
    <!-- knobs -->
    <circle cx="118" cy="22" r="6" fill="#3a2f24"/>
    <circle cx="134" cy="22" r="6" fill="#3a2f24"/>
    <!-- LED -->
    <circle cx="124" cy="44" r="3" fill="#c97a5a"/>
    <!-- antennae -->
    <line x1="120" y1="-2" x2="110" y2="-30" stroke="#3a2f24" stroke-width="3"/>
    <line x1="135" y1="-2" x2="145" y2="-30" stroke="#3a2f24" stroke-width="3"/>
  </g>

  <!-- ============ POTTED PLANT (floor right) ============ -->
  <g transform="translate(1410,810)">
    <!-- leaves -->
    <path d="M 40 30 q -32 -50 -22 -110 q 24 38 22 110" fill="#3a4a40" opacity="0.9"/>
    <path d="M 40 30 q 0 -54 30 -94 q 6 56 -30 94" fill="#3a5a40" opacity="0.85"/>
    <path d="M 40 30 q 26 -38 60 -42 q -10 38 -60 42" fill="#3a4a40" opacity="0.8"/>
    <!-- pot -->
    <path d="M 4 38 L 12 100 L 68 100 L 76 38 Z" fill="#a04a30"/>
    <rect x="-2" y="28" width="84" height="14" fill="#8a3e26"/>
  </g>

  <!-- ============ THROW RUG on floor (in front of desk) ============ -->
  <ellipse cx="640" cy="940" rx="320" ry="38" fill="#5a3838" opacity="0.65"/>
  <ellipse cx="640" cy="940" rx="260" ry="28" fill="#7a4a42" opacity="0.55"/>
  <ellipse cx="640" cy="940" rx="180" ry="18" fill="#9a6450" opacity="0.4"/>
</svg>
